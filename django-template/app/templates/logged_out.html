{% extends 'base.html' %}

{% block title %}Logged-Out Area - Test{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">

  <section class="card w-full max-w-md text-center" aria-labelledby="session-ended-heading">
    <span class="mx-auto mb-4 flex size-10 items-center justify-center rounded-md bg-surface-secondary text-brand">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" class="size-5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
      </svg>
    </span>

    <h1 id="session-ended-heading" class="text-xl font-semibold text-fg">Session ended</h1>
    <p class="mt-2 text-sm text-fg-secondary">
      This screen extends <code class="text-xs">base.html</code> without a session, so the sidebar is hidden and the
      content uses the full width of the page.
    </p>

    <div class="mt-6 flex flex-col gap-2 sm:flex-row sm:justify-center">
      <a href="/" id="back-button" class="btn btn-primary">Back to home</a>
      <a href="/logged-in" class="btn btn-secondary">Log in again</a>
    </div>
  </section>

</div>
{% endblock %}
